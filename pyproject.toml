[project]
name = "linkedin-saved-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dani Zysman", email = "dani.zysman@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.4",
    "google-genai>=3.1.0",
    "pydantic>=2.14.3",
    "qdrant-client[fastembed]>=1.20.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
linkedin-saved-rag = "linkedin_saved_rag:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
