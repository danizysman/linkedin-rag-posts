[project]
name = "linkedin-saved-rag"
version = "0.1.0"
description = "Hybrid Search & RAG service for LinkedIn saved posts"
readme = "README.md"
authors = [
    { name = "Dani Zysman", email = "dani.zysman@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.4",
    "google-genai>=3.1.0",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.33",
    "qdrant-client[fastembed]>=1.20.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
